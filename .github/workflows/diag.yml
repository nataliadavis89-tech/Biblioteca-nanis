name: Diagnóstico
on:
  push:
    branches: [diag-oct]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar fotos de Funkos recientes (solo lectura)
        run: |
          pip install -q pillow >/dev/null 2>&1
          URL=https://gothamlibrary-emefreak-new.netlify.app
          curl -sS "$URL/api/funkos" -o f.json
          python3 - <<'PY'
          import json, urllib.request, io
          from PIL import Image
          URL="https://gothamlibrary-emefreak-new.netlify.app"
          fs=json.load(open("f.json"))
          rec=[f for f in fs if "edd" in (f.get("name","")+f.get("franchise","")).lower() or "edward" in f.get("name","").lower()] + sorted(fs,key=lambda f:f.get("updatedAt") or 0)[-2:]
          for f in rec:
              p=f.get("photo") or ""
              info=""
              try:
                  src=URL+p if p.startswith("/") else p
                  if src:
                      im=Image.open(io.BytesIO(urllib.request.urlopen(src,timeout=20).read()))
                      rgb=im.convert("RGBA")
                      w,h=rgb.size
                      corners=[rgb.getpixel(xy) for xy in [(2,2),(w-3,2),(2,h-3),(w-3,h-3)]]
                      info=f"{im.format} {im.mode} {w}x{h} esquinas={corners}"
              except Exception as e: info="err "+str(e)[:80]
              src_kind = "propia" if p.startswith("/api/cover/") else ("catálogo" if p.startswith("http") else ("vacía" if not p else p[:20]))
              print(f"::notice title={f.get('name','?')[:40]}::foto {src_kind} {p[:60]} · upd={f.get('updatedAt')} · {info}")
          PY
