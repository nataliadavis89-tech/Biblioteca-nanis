<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gotham Library</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--surface3:#242424;
  --gold:#F5A623;--gold2:#E8951A;--gold-dim:#8a5c10;--gold-glow:rgba(245,166,35,0.15);
  --text:#e8e8e8;--text2:#999;--text3:#555;
  --green:#2ecc71;--blue:#3498db;--red:#e74c3c;--purple:#9b59b6;
  --border:rgba(255,255,255,0.06);--border2:rgba(245,166,35,0.2);
  --status-done:#1a3a2a;--status-done-text:#2ecc71;
  --status-reading:#1a2a3a;--status-reading-text:#3498db;
  --status-pending:#2a2010;--status-pending-text:#F5A623;
  --status-wish:#2a1a2a;--status-wish-text:#9b59b6;
  --status-abandon:#2a1a1a;--status-abandon-text:#e74c3c;
  --nav-h:70px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
body{display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;height:100%}
#app{flex:1;overflow:hidden;position:relative;height:100%}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 10px)}
.screen.active{display:block}
.screen::-webkit-scrollbar{display:none}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:32px;height:32px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;fill:var(--bg)}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold)}
.logo-sub{font-size:9px;letter-spacing:3px;color:var(--text3);text-transform:uppercase}
.topbar-actions{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border:1px solid var(--border);background:var(--surface);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2)}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
#sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);transition:background 0.3s,box-shadow 0.3s;flex-shrink:0;align-self:center;margin-left:-2px}
#sync-dot.sync-active{background:var(--green);box-shadow:0 0 6px var(--green)}
#nav{height:calc(var(--nav-h) + var(--safe-bottom));background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 0;position:relative;color:var(--text3)}
.nav-item.active{color:var(--gold)}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav-item span{font-size:10px;letter-spacing:0.5px;font-weight:500}
.nav-add{flex:0 0 64px;display:flex;align-items:center;justify-content:center;margin-top:-20px}
.nav-add-btn{width:56px;height:56px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.nav-add-btn:active{transform:scale(0.95)}
.nav-add-btn svg{width:24px;height:24px;stroke:var(--bg);fill:none;stroke-width:2.5}
.nav-underline{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--gold);border-radius:1px;display:none}
.nav-item.active .nav-underline{display:block}
.home-hero{padding:20px 16px 0;margin-bottom:4px}
.home-greeting{font-size:13px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.home-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--text);line-height:1.1}
.home-title span{color:var(--gold)}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:16px 16px 0}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:3px;height:100%;background:var(--accent,var(--gold))}
.stat-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--text);line-height:1}
.stat-sub{font-size:11px;color:var(--text2);margin-top:2px}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 10px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--text2);text-transform:uppercase}
.section-link{font-size:12px;color:var(--gold);cursor:pointer}
.reading-card{margin:0 16px 8px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:14px;display:flex;gap:12px;cursor:pointer}
.reading-card:active{background:var(--surface2)}
.cover-placeholder{width:52px;height:74px;border-radius:6px;background:var(--surface3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cover-placeholder svg{width:20px;height:20px;stroke:var(--text3);fill:none;stroke-width:1.5}
.reading-info{flex:1;min-width:0}
.reading-status{font-size:10px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
.reading-title{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.reading-author{font-size:12px;color:var(--text2);margin-bottom:8px}
.progress-bar{height:3px;background:var(--surface3);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:2px}
.progress-text{font-size:11px;color:var(--text3);margin-top:4px}
.points-banner{margin:8px 16px 0;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.points-icon{width:40px;height:40px;background:var(--gold-glow);border:1px solid var(--border2);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.points-icon svg{width:20px;height:20px;fill:var(--gold)}
.points-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.points-amount{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--gold);line-height:1}
.points-hint{font-size:10px;color:var(--text3)}
.recent-list{padding:0 16px}
.search-bar{margin:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px}
.search-bar svg{width:16px;height:16px;stroke:var(--text3);flex-shrink:0;fill:none;stroke-width:1.5}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;padding:10px 0;font-family:'Inter',sans-serif}
.search-bar input::placeholder{color:var(--text3)}
.filter-row{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);white-space:nowrap}
.filter-chip.active{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.book-list{padding:0 16px}
.book-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.book-item:active{opacity:0.7}
.book-item:last-child{border-bottom:none}
.book-thumb{width:50px;height:70px;border-radius:6px;background:var(--surface3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.book-thumb img{width:50px;height:70px;object-fit:cover}
.book-thumb svg{width:18px;height:18px;stroke:var(--text3);fill:none;stroke-width:1.5}
.book-meta{flex:1;min-width:0;padding-top:2px}
.book-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-author{font-size:12px;color:var(--text2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
.badge svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2}
.badge-done{background:var(--status-done);color:var(--status-done-text)}
.badge-reading{background:var(--status-reading);color:var(--status-reading-text)}
.badge-pending{background:var(--status-pending);color:var(--status-pending-text)}
.badge-wish{background:var(--status-wish);color:var(--status-wish-text)}
.badge-abandon{background:var(--status-abandon);color:var(--status-abandon-text)}
.stars-mini{display:flex;gap:1px;align-items:center}
.star-mini{width:10px;height:10px;fill:var(--gold)}
.star-mini.empty{fill:var(--surface3)}
.progress-mini{display:flex;align-items:center;gap:6px}
.progress-mini-bar{width:50px;height:3px;background:var(--surface3);border-radius:2px;overflow:hidden}
.progress-mini-fill{height:100%;background:var(--blue);border-radius:2px}
.progress-mini span{font-size:10px;color:var(--text2)}
.detail-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:700;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.detail-screen.open{display:block}
.detail-screen::-webkit-scrollbar{display:none}
.detail-hero{position:relative;height:200px;overflow:visible}
.detail-hero-bg{position:absolute;inset:0;background:var(--surface);overflow:hidden}
.detail-hero-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(0.4) blur(8px);transform:scale(1.1)}
.detail-hero-cover{position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.detail-hero-cover img{width:80px;height:112px;object-fit:cover;border-radius:6px}
.no-cover-hero{width:80px;height:112px;border-radius:6px;background:var(--surface3);display:flex;align-items:center;justify-content:center}
.no-cover-hero svg{width:28px;height:28px;stroke:var(--text3);fill:none;stroke-width:1.5}
.detail-topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;z-index:10}
.back-btn{width:36px;height:36px;background:rgba(0,0,0,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,0.1)}
.back-btn svg{width:18px;height:18px;stroke:white;fill:none;stroke-width:2}
.detail-status-pill{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:0.5px}
.detail-content{padding:16px}
.detail-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--text);line-height:1.1;margin-bottom:4px}
.detail-author{font-size:14px;color:var(--text2);margin-bottom:16px}
.status-tabs{display:flex;gap:4px;margin-bottom:16px}
.status-tab{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.status-tab.active{background:var(--gold);border-color:var(--gold)}
.status-tab svg{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:1.5}
.status-tab.active svg{stroke:var(--bg)}
.status-tab span{font-size:9px;color:var(--text3);font-weight:500}
.status-tab.active span{color:var(--bg)}
.detail-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.detail-section-title{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.detail-section-title svg{width:12px;height:12px;stroke:var(--gold);fill:none;stroke-width:2}
.stars-input{display:flex;gap:6px}
.star-input{width:28px;height:28px;cursor:pointer;fill:var(--surface3);stroke:var(--gold);stroke-width:1}
.star-input.filled{fill:var(--gold)}
textarea.notes-input{width:100%;background:none;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;resize:none;min-height:80px;line-height:1.6}
textarea.notes-input::placeholder{color:var(--text3)}
.reread-btns{display:flex;gap:6px}
.reread-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:12px;color:var(--text2);text-align:center}
.reread-btn.active{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:600}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.meta-item{display:flex;align-items:center;gap:8px;padding:8px;background:var(--surface2);border-radius:8px}
.meta-item svg{width:14px;height:14px;stroke:var(--gold-dim);fill:none;stroke-width:1.5;flex-shrink:0}
.meta-item span{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.genre-tag{display:inline-block;padding:4px 10px;background:rgba(245,166,35,0.1);border:1px solid var(--border2);border-radius:20px;font-size:11px;color:var(--gold);font-weight:500}
.synopsis-text{font-size:13px;color:var(--text2);line-height:1.7}
.reward-banner{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.reward-icon{width:44px;height:44px;background:var(--gold-glow);border-radius:10px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.reward-icon svg{width:22px;height:22px;fill:var(--gold)}
.reward-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.reward-amount{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold);line-height:1}
.reward-hint{font-size:10px;color:var(--text3)}
.progress-label{font-size:12px;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between}
.progress-track{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-bottom:6px}
.progress-fill-full{height:100%;background:var(--blue);border-radius:3px}
.progress-input-row{display:flex;align-items:center;gap:8px}
.progress-input-row input{flex:1;height:32px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);text-align:center;font-size:14px;font-weight:600;outline:none;font-family:'Inter',sans-serif}
.progress-input-row input:focus{border-color:var(--gold)}
.progress-input-row span{font-size:12px;color:var(--text2);white-space:nowrap}
.save-btn{width:100%;padding:14px;background:var(--gold);border-radius:12px;border:none;color:var(--bg);font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:0.5px;margin-top:4px}
.save-btn:active{background:var(--gold2)}
.delete-btn{width:100%;padding:12px;background:none;border:1px solid rgba(231,76,60,0.3);border-radius:12px;color:var(--red);font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;margin-top:8px;margin-bottom:16px}
.delete-btn:active{background:rgba(231,76,60,0.1)}
.add-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:800;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:40px;display:none}
.add-screen.open{display:block}
.add-screen::-webkit-scrollbar{display:none}
.add-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:850}
.add-header h2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px}
.add-body{padding:16px}
.field-group{margin-bottom:16px}
.field-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.field-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;-webkit-appearance:none;appearance:none}
.field-input:focus{border-color:var(--gold)}
.field-input::placeholder{color:var(--text3)}
select.field-input option{background:var(--surface)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.isbn-row{display:flex;gap:8px}
.isbn-row .field-input{flex:1}
.isbn-btn{padding:11px 14px;background:var(--gold);border-radius:10px;border:none;color:var(--bg);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.isbn-btn:active{background:var(--gold2)}
.cover-preview-wrap{width:70px;height:98px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
.cover-preview-wrap img{width:70px;height:98px;object-fit:cover}
.cover-preview-wrap svg{width:24px;height:24px;stroke:var(--text3);fill:none;stroke-width:1.5}
.status-select-row{display:flex;gap:8px;flex-wrap:wrap}
.status-opt{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--text2);cursor:pointer}
.status-opt.s-terminado.active{background:var(--status-done);border-color:var(--status-done-text);color:var(--status-done-text)}
.status-opt.s-leyendo.active{background:var(--status-reading);border-color:var(--status-reading-text);color:var(--status-reading-text)}
.status-opt.s-pendiente.active{background:var(--status-pending);border-color:var(--status-pending-text);color:var(--status-pending-text)}
.status-opt.s-wishlist.active{background:var(--status-wish);border-color:var(--status-wish-text);color:var(--status-wish-text)}
.status-opt.s-abandonado.active{background:var(--status-abandon);border-color:var(--status-abandon-text);color:var(--status-abandon-text)}
.divider{height:1px;background:var(--border);margin:8px 0 16px}
.section-head{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--text2);margin-bottom:12px}
.wish-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.wish-item:active{opacity:0.7}
.wish-item-info{flex:1;min-width:0}
.wish-item-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wish-item-author{font-size:12px;color:var(--text2)}
.wish-move-btn{padding:6px 12px;background:var(--gold-glow);border:1px solid var(--border2);border-radius:8px;color:var(--gold);font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0;white-space:nowrap}
.wish-move-btn:active{background:rgba(245,166,35,0.25)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;text-align:center}
.empty-state svg{width:48px;height:48px;stroke:var(--text3);fill:none;stroke-width:1;margin-bottom:16px}
.empty-state h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--text2);margin-bottom:8px}
.empty-state p{font-size:13px;color:var(--text3);line-height:1.6}
.profile-header{padding:24px 16px 16px;text-align:center}
.profile-avatar{width:72px;height:72px;background:var(--gold-glow);border:2px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.profile-avatar svg{width:32px;height:32px;fill:var(--gold)}
.profile-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--text)}
.profile-sub{font-size:12px;color:var(--text3);margin-top:2px}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 16px}
.profile-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.profile-stat-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold);line-height:1}
.profile-stat-label{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.achievements{padding:0 16px}
.ach-item{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
.ach-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ach-info{flex:1}
.ach-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.ach-desc{font-size:12px;color:var(--text3)}
.ach-pts{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold)}
.genre-chart{padding:0 16px 16px}
.genre-item{margin-bottom:10px}
.genre-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.genre-name{font-size:12px;color:var(--text2)}
.genre-count{font-size:12px;color:var(--text3)}
.genre-bar-bg{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.genre-bar-fill{height:100%;background:var(--gold);border-radius:2px}
.toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--text);z-index:9999;opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.isbn-loading{display:none;align-items:center;gap:8px;font-size:12px;color:var(--text3);padding:8px 0}
.isbn-loading.show{display:flex}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%}
#save-fab:active{transform:scale(0.95);opacity:0.85}
#save-fab.saving{background:var(--surface2);color:var(--text2);box-shadow:none;pointer-events:none}
#save-fab.saved{background:#2ecc71;box-shadow:0 4px 20px rgba(46,204,113,0.4)}
/* Smart search */
.smart-search-wrap{position:relative;margin-bottom:4px}
.smart-search-bar{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:0 12px}
.smart-search-bar svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2;flex-shrink:0}
.smart-search-input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px;padding:12px 0;font-family:'Inter',sans-serif}
.smart-search-input::placeholder{color:var(--text3)}
.smart-search-clear{color:var(--text3);cursor:pointer;font-size:14px;padding:4px;line-height:1}
.smart-results{background:var(--surface2);border:1px solid var(--border);border-radius:12px;margin-top:6px;overflow:hidden;max-height:320px;overflow-y:auto}
.smart-results:empty{display:none}
.smart-result-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.smart-result-item:last-child{border-bottom:none}
.smart-result-item:active{background:var(--surface3)}
.smart-loading{display:flex;align-items:center;gap:8px;padding:14px 12px;font-size:12px;color:var(--text3)}
.smart-empty{padding:14px 12px;font-size:12px;color:var(--text3);text-align:center}
/* Edition badges */
.edition-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;flex-shrink:0;margin-top:3px}
.edition-badge.ilustrada{background:rgba(155,89,182,0.2);border:1px solid rgba(155,89,182,0.5);color:#c39bd3}
.edition-badge.especial{background:rgba(245,166,35,0.15);border:1px solid rgba(245,166,35,0.4);color:var(--gold)}
.edition-badge.coleccionista{background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.4);color:#e98074}
.edition-badge.lujo{background:rgba(52,152,219,0.15);border:1px solid rgba(52,152,219,0.4);color:#7fb3d3}
.edition-badge.anotada{background:rgba(46,204,113,0.15);border:1px solid rgba(46,204,113,0.4);color:#82e0aa}
.edition-badge.limitada{background:rgba(231,76,60,0.2);border:1px solid rgba(231,76,60,0.6);color:#f1948a}
/* Edition filter chips */
.edition-type-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0}
.edition-type-row::-webkit-scrollbar{display:none}
.edition-chip{flex-shrink:0;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text3);white-space:nowrap}
.edition-chip.active{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.edition-chip:active{opacity:0.7}
/* URL extract strip */
.url-extract-strip{display:flex;gap:6px;align-items:center;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:0 10px;margin-top:6px}
.url-extract-strip input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;padding:10px 0;font-family:'Inter',sans-serif}
.url-extract-strip input::placeholder{color:var(--text3)}
.url-extract-btn{flex-shrink:0;padding:6px 12px;background:var(--gold);color:var(--bg);border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.url-extract-btn:disabled{background:var(--surface3);color:var(--text3)}/* Edition tag selector (multi-select chips) */
.etag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.etag{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);white-space:nowrap;-webkit-tap-highlight-color:transparent;user-select:none}
.etag:active{opacity:0.7}
.etag.sel-ilustrada{background:rgba(155,89,182,0.2);border-color:rgba(155,89,182,0.6);color:#c39bd3}
.etag.sel-especial{background:rgba(245,166,35,0.15);border-color:rgba(245,166,35,0.5);color:var(--gold)}
.etag.sel-tapadura{background:rgba(52,152,219,0.15);border-color:rgba(52,152,219,0.5);color:#7fb3d3}
.etag.sel-tapablanda{background:rgba(46,204,113,0.15);border-color:rgba(46,204,113,0.5);color:#82e0aa}
.etag.sel-ebook{background:rgba(155,89,182,0.12);border-color:rgba(231,76,60,0.5);color:#f1948a}
/* Mini badges shown in book lists */
.etag-mini{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:0.3px}
.etag-mini.ilustrada{background:rgba(155,89,182,0.2);color:#c39bd3}
.etag-mini.especial{background:rgba(245,166,35,0.15);color:var(--gold)}
.etag-mini.tapadura{background:rgba(52,152,219,0.15);color:#7fb3d3}
.etag-mini.tapablanda{background:rgba(46,204,113,0.15);color:#82e0aa}
.etag-mini.ebook{background:rgba(231,76,60,0.12);color:#f1948a}
/* Cover action buttons */
.cover-action-btn{width:34px;height:34px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2)}
.cover-action-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
.wallet-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);z-index:1000;display:none;align-items:flex-end;justify-content:center}
.wallet-overlay.open{display:flex}
.wallet-panel{background:var(--surface);border:1px solid var(--border2);border-radius:20px 20px 0 0;width:100%;max-width:430px;max-height:80vh;overflow-y:auto;padding:24px 20px 50px;-webkit-overflow-scrolling:touch}
.wallet-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.wallet-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.wallet-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;width:100%}
.wallet-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.wallet-btn-add{background:var(--gold);color:var(--bg)}
.wallet-btn-spend{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.wallet-tx-form{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px}
.wallet-confirm-btn{flex:1;padding:10px;background:var(--gold);color:var(--bg);border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.wallet-cancel-btn{padding:10px 16px;background:var(--surface3);color:var(--text2);border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif}
.wallet-history-header{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:10px}
.wallet-history{display:flex;flex-direction:column;gap:6px}
.wallet-tx{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
.wallet-tx-info{display:flex;flex-direction:column;gap:2px}
.wallet-tx-desc{font-size:13px;color:var(--text)}
.wallet-tx-date{font-size:11px;color:var(--text3)}
.wallet-tx-val{font-family:'Bebas Neue',sans-serif;font-size:18px}
.wallet-tx-val.pos{color:var(--green)}
.wallet-tx-val.neg{color:#e74c3c}

/* ── MULTI-SELECT ─────────────────────────────────────────────── */
.book-item.selected{background:rgba(245,166,35,0.12)!important;border-left:3px solid var(--gold);}
.book-item .sel-check{display:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:var(--surface2);margin-right:10px;flex-shrink:0;align-items:center;justify-content:center;}
.select-mode .book-item .sel-check{display:flex;}
.select-mode .book-item{padding-left:8px;}
.book-item.selected .sel-check{background:var(--gold);border-color:var(--gold);color:#000;}
.bulk-bar{position:sticky;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border2);padding:12px 16px;display:none;z-index:50;gap:8px;flex-wrap:wrap;}
.bulk-bar.show{display:flex;}
.bulk-btn{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;font-family:Inter,sans-serif;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.bulk-btn.danger{border-color:#e74c3c44;color:#e74c3c;}
.bulk-btn.primary{border-color:var(--gold);color:var(--gold);}
.sel-count{font-size:13px;color:var(--gold);font-weight:700;padding:8px 0;flex:1;}

.sort-chip.active{background:rgba(245,166,35,0.15)!important;color:var(--gold)!important;border-color:rgba(245,166,35,0.4)!important;}
.sort-chip::-webkit-scrollbar{display:none;}
/* ══ FUNKOS ══ */
.fk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 16px 0}
.fk-stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.fk-stat b{font-family:'Bebas Neue',sans-serif;font-size:28px;font-weight:400;color:var(--gold);line-height:1}
.fk-stat span{font-size:11px;color:var(--text2)}
.fk-stat[onclick]{cursor:pointer}.fk-stat[onclick]:active{background:var(--surface2)}
.fk-stat-on{border-color:var(--gold)}
.fk-shelf{margin-top:18px}
.fk-shelf-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 10px}
.fk-shelf-head span:first-child{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--text)}
.fk-count{font-size:12px;color:var(--text2)}
.fk-row{display:flex;gap:0;overflow-x:auto;padding:0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fk-row::-webkit-scrollbar{display:none}
.fk-wrap{flex-wrap:wrap;row-gap:16px;overflow:visible;justify-content:flex-start}
.fk-wrap .fk-item{flex:0 0 33.33%}
.fk-item{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.fk-item:active{opacity:.75}
.fk-fig{position:relative;width:86px;height:100px;border-radius:12px 12px 4px 4px;overflow:hidden;background:var(--surface2);border:1px solid var(--border);border-bottom:none;display:flex;align-items:center;justify-content:center}
.fk-fig img{width:100%;height:100%;object-fit:cover;display:block}
.fk-fig svg{width:30px;height:30px;stroke:var(--text3);fill:none;stroke-width:1.5}
.fk-tag{position:absolute;top:4px;left:4px;padding:1px 5px;border-radius:4px;background:rgba(10,10,10,.85);color:var(--gold);font-size:8px;font-weight:700;letter-spacing:.5px}
.fk-plank-seg{width:100%;height:12px;background:#3a2a18;border-top:2px solid #c98e2e;box-shadow:0 8px 14px rgba(245,166,35,.08)}
.fk-num{margin-top:6px;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;color:var(--gold);line-height:1}
.fk-num-empty{color:var(--text3)}
.fk-name{padding:2px 4px 0;font-size:10.5px;line-height:1.25;color:var(--text2);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fk-photo{height:240px;border-radius:14px;overflow:hidden;background:var(--surface);border:1.5px dashed var(--gold-dim);display:flex;align-items:center;justify-content:center}
.fk-photo img{width:100%;height:100%;object-fit:contain;background:#111}
.fk-photo-empty{font-size:13px;color:var(--text2)}
.fk-btn{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.fk-btn-gold{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.fk-opt.active{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:600}
.fk-del{width:100%;margin-top:12px;padding:13px;border-radius:12px;background:none;border:1px solid rgba(231,76,60,.35);color:var(--red);font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer}
.fk-del.armed{background:var(--red);color:#fff}
#funko-screen{z-index:820}
.fk-res{display:flex;gap:12px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:8px;cursor:pointer}
.fk-res:active{background:var(--surface2)}
.fk-res img,.fk-res-img{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#fff;flex-shrink:0}
.fk-res-meta{flex:1;min-width:0}
.fk-res-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fk-res-sub{font-size:12px;color:var(--text2);margin-top:2px}
.fk-res-sub b{color:var(--gold);font-weight:600}
.fk-res-extra{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fk-res-msg{font-size:12px;color:var(--text3);padding:6px 2px 10px}
.fk-res-src{font-size:10px;color:var(--text3);text-align:right;margin:-2px 2px 8px}
.fk-or{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);text-align:center;margin:10px 0 14px}
</style>
</head>

// ══ ALMACÉN LOCAL (IndexedDB) ══════════════════════════════════════
// localStorage se llena con ~7 MB de libros en iPhone y rompía el arranque.
const _idbP = new Promise((res)=>{
  try{
    const r = indexedDB.open('gotham-library', 1);
    r.onupgradeneeded = ()=>r.result.createObjectStore('kv');
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>res(null);
  }catch(e){ res(null); }
});
async function idbGet(k){
  const db = await _idbP; if(!db) return null;
  return new Promise(res=>{
    try{ const q = db.transaction('kv','readonly').objectStore('kv').get(k); q.onsuccess=()=>res(q.result ?? null); q.onerror=()=>res(null); }
    catch(e){ res(null); }
  });
}
async function idbSet(k, v){
  const db = await _idbP; if(!db) return;
  return new Promise(res=>{
    try{ const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v, k); t.oncomplete=()=>res(); t.onerror=()=>res(); }
    catch(e){ res(); }
  });
}

// ══ FUNKOS ═════════════════════════════════════════════════════════
let funkos = [], funkoCat = 'Todos', funkoEditId = null, funkoForm = null, funkoDelArmed = false, curScreen = 'home';
const FUNKO_CATS = ['DC','Marvel','Terror','Películas','Series','Músicos','Anime','Mini','Por identificar'];
const FUNKO_FORMATS = {pop:'Pop! suelto', afiche:'Con afiche', mini:'Mini'};

function funkoCats(){
  const extra = [...new Set(funkos.map(f=>f.category).filter(c=>c && !FUNKO_CATS.includes(c)))];
  return FUNKO_CATS.slice(0,-1).concat(extra, ['Por identificar']);
}

async function loadFunkos(){
  const cached = await idbGet('funkos');
  if(Array.isArray(cached)){ funkos = cached; renderFunkos(); }
  try{
    const r = await fetch('/api/funkos', {cache:'no-store'});
    if(r.ok){
      const remote = await r.json();
      if(Array.isArray(remote)){
        funkos = remote; idbSet('funkos', funkos); renderFunkos(); if(curScreen==='profile') renderProfile(); return;
      }
      if(remote === null && !funkos.length){
        // Primera vez: se carga la colección identificada en las fotos
        funkos = JSON.parse(JSON.stringify(FUNKOS_SEED));
        renderFunkos(); saveFunkos();
      }
    }
  }catch(e){ console.warn('Funkos: sin conexión, uso copia local', e); }
}

async function saveFunkos(){
  await idbSet('funkos', funkos);
  try{
    const r = await fetch('/api/funkos', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(funkos)});
    if(r.status === 409){ showToast('⚠️ Guardado bloqueado por seguridad — recargando'); loadFunkos(); }
    else if(!r.ok){ showToast('⚠️ No se pudo guardar en la nube (queda en el móvil)'); }
  }catch(e){ showToast('⚠️ Sin conexión — guardado en el móvil'); }
}

function setFunkoCat(c){ funkoCat = c; renderFunkos(); }

function renderFunkos(){
  const el = document.getElementById('funkos-content'); if(!el) return;
  const allOwned = funkos.filter(f=>f.status !== 'wishlist');
  const allWish = funkos.filter(f=>f.status === 'wishlist');
  const qi = document.getElementById('fk-search');
  const q = (qi && qi.value || '').trim().toLowerCase().replace(/^#/,'');
  const norm = t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const match = f=>!q || [f.name,f.number,f.franchise,f.category,f.notes].some(v=>norm(v).includes(norm(q)));
  const owned = allOwned.filter(match);
  const wish = allWish.filter(match);
  const cats = funkoCats();
  const chips = ['Todos'].concat(allWish.length ? ['Wishlist'] : [], cats.filter(c=>allOwned.some(f=>f.category===c)))
    .map(c=>`<div class="filter-chip${c===funkoCat?' active':''}" onclick="setFunkoCat('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</div>`).join('');

  let groups;
  if(q) groups = [['RESULTADOS', owned.concat(wish)]].filter(g=>g[1].length);
  else if(funkoCat === 'Wishlist') groups = [['WISHLIST', wish]];
  else {
    groups = cats.filter(c=>funkoCat==='Todos'||c===funkoCat).map(c=>[c.toUpperCase(), owned.filter(f=>f.category===c)]).filter(g=>g[1].length);
    if(funkoCat==='Todos' && wish.length) groups.push(['WISHLIST', wish]);
  }

  const shelf = ([title, items])=>`
    <div class="fk-shelf">
      <div class="fk-shelf-head"><span>${esc(title)}</span><span class="fk-count">${items.length} ${items.length===1?'figura':'figuras'}</span></div>

function shrinkPhoto(file, MAX){
  return new Promise(res=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{
      let w = img.naturalWidth, h = img.naturalHeight; const r = Math.min(1, MAX/Math.max(w,h)); w = Math.round(w*r); h = Math.round(h*r);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      try{ res(c.toDataURL('image/jpeg', 0.72)); }catch(e){ res(null); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}

// ── COMPRIMIR IMAGEN — compatible con iOS Safari ──────────────────
// iOS Safari tiene límite de ~16MP en canvas. Imágenes de iPhone son 12MP+
// Usamos createObjectURL para evitar el bug de canvas negro con base64 grandes
function compressImage(file_or_dataUrl){
  return new Promise(res=>{
    let objectUrl=null;

    const doCompress=(src)=>{
      const img=new Image();
      img.onload=()=>{
        // Máx 600px de ancho para portada — más que suficiente visualmente
        const MAX=600;
        let w=img.naturalWidth||img.width;
        let h=img.naturalHeight||img.height;

        // Reducir a máx 4MP primero para evitar el límite de canvas de iOS
        if(w*h > 4000000){
          const r=Math.sqrt(4000000/(w*h));
          w=Math.round(w*r); h=Math.round(h*r);
        }
        // Luego escalar a tamaño de portada
        if(w>MAX){
          const r=MAX/w;
          w=Math.round(w*r); h=Math.round(h*r);
        }

        const c=document.createElement('canvas');
        c.width=w; c.height=h;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#fff';
        ctx.fillRect(0,0,w,h); // fondo blanco — evita negro en transparencias
        ctx.drawImage(img,0,0,w,h);

        // Verificar que no salió negro (pixel test)
        const px=ctx.getImageData(Math.floor(w/2),Math.floor(h/2),1,1).data;
        if(px[0]===0&&px[1]===0&&px[2]===0){
          // Canvas negro — problema de iOS, intentar con calidad menor
          console.warn('Canvas negro detectado, reintentando…');
        }

        let out=c.toDataURL('image/jpeg',0.7);
        if(out.length>800000) out=c.toDataURL('image/jpeg',0.5);
        if(out.length>800000) out=c.toDataURL('image/jpeg',0.35);

        if(objectUrl) URL.revokeObjectURL(objectUrl);
        res(out);
      };
      img.onerror=()=>{
        if(objectUrl) URL.revokeObjectURL(objectUrl);
        // Si falla, devolver null para que el caller use la URL externa
        res(null);
      };
      img.src=src;
    };

    // Si es un File/Blob, usar ObjectURL (evita el bug de iOS con base64 grandes)
    if(file_or_dataUrl instanceof Blob||file_or_dataUrl instanceof File){
      objectUrl=URL.createObjectURL(file_or_dataUrl);
      doCompress(objectUrl);
    } else {
      // Es un dataUrl — usarlo directamente
      doCompress(file_or_dataUrl);
    }
  });
}

async function saveBookCover(bookId, dataUrl){
  if(!dataUrl||!dataUrl.startsWith('data:'))return dataUrl;
  try{
    const compressed=await compressImage(dataUrl);
    const sizeKB=Math.round(compressed.length/1024);
    console.log(`Portada ${bookId}: ${sizeKB}KB`);

    const coverTs=Date.now();
    
    // Guardar portada y timestamp en localStorage
    try{localStorage.setItem('cover_'+bookId, compressed);}catch(e){}
    try{localStorage.setItem('cover_ts_'+bookId, String(coverTs));}catch(e){}
    return compressed;
  }catch(e){
    console.warn('Error guardando portada en Firestore, usando localStorage:',e);
    // Fallback: guardar solo en localStorage
    try{
      const compressed=await compressImage(dataUrl);
      localStorage.setItem('cover_'+bookId, compressed);
      return compressed;
    }catch(e2){return dataUrl;}
  }
}

async function loadBooks(){

  const hc=document.getElementById('home-content');
  if(hc && !books.length) hc.innerHTML='<div style="padding:90px 16px;text-align:center;color:var(--text3);font-size:12px;letter-spacing:2px">CARGANDO TU ARCHIVO…</div>';
  // 1) Copia local al instante (IndexedDB; si no hay, la antigua de localStorage)
  try{
    let cached=await idbGet('books');
    if(!Array.isArray(cached)||!cached.length){ const ls=localStorage.getItem('gl_books_v4'); if(ls) cached=JSON.parse(ls); }
    if(Array.isArray(cached)&&cached.length&&!books.length){ books=cached; renderHome(); renderLibrary(); renderWishlist(); }
  }catch(e){}
  // 2) Si quedaron cambios sin subir en este móvil, NO se pisan con la nube: se suben
  try{
    if(books.length && await idbGet('books_pending')){
      renderHome(); renderLibrary(); renderWishlist();
      showToast('Subiendo cambios pendientes…');
      await saveBooks();
      if(!(await idbGet('books_pending'))) showToast('✓ Cambios pendientes guardados');
      return;
    }
  }catch(e){}
  // 3) La nube manda
  try{
    const resp=await fetch('/api/books',{cache:'no-store'});
    if(resp.ok){
      const remote=await resp.json();
      if(Array.isArray(remote)&&remote.length){
        books=remote;
        await idbSet('books',books);
        try{ localStorage.removeItem('gl_books_v4'); }catch(e){}
      }
    }
  }catch(e){ console.warn('Cloud unavailable, using local:',e); }
  renderHome(); renderLibrary(); renderWishlist();
  if(!books.length) showToast('⚠️ No se pudo cargar la biblioteca — pulsa ↻');
  // Una sola vez: sacar las portadas incrustadas de la lista (la aligera de ~10 MB a pocos cientos de KB)
  else if(books.some(b=>isDataCover(b.cover))) saveBooks();
}

    bookList.forEach(b=>{
      if((!b.cover||b.cover==='__cover__') && covers[b.id]){
        b.cover = covers[b.id];
        injected++;
      }
    });
    // Re-render if we injected any covers
    if(injected > 0){
      renderHome(); renderLibrary(); renderWishlist();
    }
  }catch(e){ console.warn('Cover load error:', e); }
}

const isDataCover = c => typeof c === 'string' && c.startsWith('data:');
async function uploadCover(id, dataUrl){
  const r = await fetch('/api/cover/' + encodeURIComponent(id), {method:'POST', headers:{'Content-Type':'text/plain'}, body:dataUrl});
  if(!r.ok) throw new Error('portada ' + r.status);
  return (await r.json()).url;
}
async function externalizeCovers(){
  const todo = books.filter(b=>isDataCover(b.cover) && /^[A-Za-z0-9_-]{1,100}$/.test(b.id));
  let done = 0;
  for(const b of todo){
    try{ const url = await uploadCover(b.id, b.cover); b.cover = url; coverCache[b.id] = url; done++; }
    catch(e){ console.warn('No se pudo subir la portada', b.id, e); }
  }
  return done;
}
async function urlToDataUrl(u){
  const r = await fetch(u); if(!r.ok) throw new Error(r.status);
  const blob = await r.blob();
  return await new Promise((res, rej)=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
}

let _savingBooks = false, _saveAgain = false;
async function saveBooks(){
  if(!books.length) return; // nunca subir una biblioteca vacía
  if(_savingBooks){ _saveAgain = true; return; }
  _savingBooks = true;
  try{
    await idbSet('books', books.map(b=>({...b})));
    await idbSet('books_pending', true);   // hay cambios sin subir
    const n = books.filter(b=>isDataCover(b.cover)).length;
    if(n > 3) showToast('Optimizando ' + n + ' portadas…');
    if(n) await externalizeCovers();
    const forCloud = books.map(b=>({...b}));
    await idbSet('books', forCloud);
    const r = await fetch('/api/books', {method:'POST', headers:{'Content-Type':'application/json','X-Count':String(forCloud.length)}, body:JSON.stringify(forCloud)});
    if(r.ok){ await idbSet('books_pending', false); if(n > 3) showToast('✓ Portadas optimizadas y guardado'); }
    else if(r.status === 409){ showToast('⚠️ Guardado bloqueado por seguridad — revisa antes de seguir'); }
    else { let m=''; try{ m=(await r.json()).error||''; }catch(e){} showToast('⚠️ No se pudo guardar en la nube (queda en el móvil)' + (m ? ' · ' + m : ' · error ' + r.status)); }
  }catch(e){ console.warn('Cloud save failed (data safe locally):', e); showToast('⚠️ Sin conexión — guardado en el móvil'); }
  finally{
    _savingBooks = false;
    if(_saveAgain){ _saveAgain = false; saveBooks(); }
  }
}

// ── GUARDAR MANUAL (botón) ────────────────────────────────────────
async function manualSave(){
  const fab=document.getElementById('save-fab');
  const lbl=document.getElementById('save-fab-label');
  if(!fab||fab.classList.contains('saving'))return;

  fab.classList.add('saving');
  if(lbl)lbl.textContent='Guardando…';

  // Safety: auto-reset after 20 seconds no matter what
  const _saveTimeout = setTimeout(()=>{
    fab.classList.remove('saving');
    if(lbl)lbl.textContent='Guardar todo';
    showToast('✓ Guardado localmente');
  }, 20000);

  // Step 1: Save text data (always works, never throws)
  await saveBooks();

  // Step 2: Upload base64 covers silently (errors don't block save)
  try{
    const coverJobs=books.filter(b=>b.cover&&b.cover.startsWith('data:'));
    if(coverJobs.length>0){
      if(lbl)lbl.textContent=`Subiendo ${coverJobs.length} portada${coverJobs.length>1?'s':''}…`;
      await Promise.allSettled(coverJobs.map(async b=>{
        try{
          // 8 second timeout per cover upload
          const withTimeout = Promise.race([
            saveBookCover(b.id,b.cover),
            new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),8000))
          ]);
          const compressed = await withTimeout;
          if(compressed){coverCache[b.id]=compressed;b.cover=compressed;}
        }catch(e){console.warn('Cover upload failed for',b.id,e.message);}
      }));
      await saveBooks();
    }
  }catch(e){console.warn('Cover batch error:',e);}

  // Step 3: Save wallet
  try{saveWallet();}catch(e){}

  // Always show success
  clearTimeout(_saveTimeout);
  fab.classList.remove('saving');
  fab.classList.add('saved');
  if(lbl)lbl.textContent='✓ Guardado';
  const hora=new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  showToast('✓ Guardado · '+hora);
  setTimeout(()=>{fab.classList.remove('saved');if(lbl)lbl.textContent='Guardar todo';},3000);
}

async function autoLoadCovers(){
  const missing=books.filter(b=>!b.cover&&b.title);
  if(!missing.length)return;
  for(const b of missing.slice(0,20)){
    try{
      const q=encodeURIComponent(b.title+(b.author?' '+b.author:''));
      const res=await fetch(`https://openlibrary.org/search.json?q=${q}&limit=1&fields=cover_i`);
      const data=await res.json();
      const coverId=data.docs&&data.docs[0]&&data.docs[0].cover_i;
      if(coverId){
        b.cover=`https://covers.openlibrary.org/b/id/${coverId}-M.jpg`;
        saveBooks();
        // Re-render any visible img with matching id
        document.querySelectorAll(`[data-bookid="${b.id}"] .book-thumb`).forEach(el=>{
          el.innerHTML=`<img src="${b.cover}" onerror="this.parentNode.innerHTML='<svg viewBox=\\'0 0 24 24\\'><path d=\\'M4 19.5A2.5 2.5 0 016.5 17H20\\'/><path d=\\'M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z\\'/></svg>'">`;

    await new Promise(r=>setTimeout(r,120));
  }
}

function chStatus(s){
  const b=books.find(x=>x.id===editId);if(!b)return;
  const was=b.status==='terminado';
  b.status=s;
  if(s==='terminado'&&!was){
    b.progress=100;b.points=10;
    saveBooks();openDetail(editId);
    showRewardModal(b.title);
  }else{
    if(s!=='terminado')b.points=0;
    saveBooks();openDetail(editId);
  }
}

  m.innerHTML=`
    <div style="background:var(--surface);border:1px solid var(--border2);border-radius:20px 20px 0 0;width:100%;padding:24px 20px 40px">

// Converts a File to base64 and calls callback(dataUrl)
function readFileAsDataUrl(file, cb){
  const reader=new FileReader();
  reader.onload=e=>cb(e.target.result);
  reader.onerror=()=>showToast('Error leyendo imagen');
  reader.readAsDataURL(file);
}

// ADD BOOK — pasa File directo a compressImage (evita bug iOS canvas negro)
function handleAddCover(input){
  setTimeout(async()=>{
    const file=input&&input.files&&input.files[0];
    if(!file)return;

    // Preview rápido con ObjectURL mientras comprime
    const previewUrl=URL.createObjectURL(file);
    prevCover(previewUrl);
    showToast('Procesando imagen…');

    // Comprimir pasando el File directamente
    const compressed=await compressImage(file);

    URL.revokeObjectURL(previewUrl);

    if(!compressed){
      showToast('Error procesando imagen — intenta con otra foto');
      return;
    }

    const coverEl=document.getElementById('a-cover');
    if(coverEl)coverEl.value=compressed;
    prevCover(compressed);
    showToast('✓ Portada lista');
  },100);
}

const EDITION_DEFS=[

function editionTagsHTML(editions,prefix,toggleFn){
  return EDITION_DEFS.map(d=>{
    const sel=(editions||[]).includes(d.key);
    return `<div class="etag${sel?' sel-'+d.key:''}" id="${prefix}${d.key}" onclick="${toggleFn}('${d.key}')">${d.label}</div>`;
  }).join('');
}

function editionMiniBadges(editions){
  if(!editions||!editions.length)return '';
  return editions.map(k=>{
    const def=EDITION_DEFS.find(d=>d.key===k);
    if(!def)return '';
    return `<span class="etag-mini ${k}">${def.label}</span>`;
  }).join('');
}

// ── SMART BOOK SEARCH — estilo Google ──────────────────────────────
let smartTimer=null, smartPage=0, smartLastQ='', smartEditionFilter='';

const EDITION_KW={
  ilustrada:  ['ilustrad','illustrated','ilustraciones','graphic novel','novela gráfica','picture book'],
  especial:   ['edición especial','special edition','ed. especial','revisada','revised','ampliada','expanded','anniversary','aniversario','conmemorativa','panorama','clásicos ilustrados'],
  coleccionista:['coleccionista','collector','deluxe','edición de coleccionista'],
  anotada:    ['anotada','anotado','annotated','con notas','comentada','prólogo de'],
  limitada:   ['limitada','limited edition','tirada limitada','numerada','numbered'],
  lujo:       ['lujo','luxury','premium','leatherbound','folio society']
};
const EDITION_LABELS={ilustrada:'🎨 Ilustrada',especial:'⭐ Especial',coleccionista:'💎 Coleccionista',anotada:'📝 Anotada',limitada:'🔴 Limitada',lujo:'✨ Lujo'};

function detectEditionType(title,subtitle){
  title=title||''; subtitle=subtitle||'';
  const hay=(title+' '+subtitle).toLowerCase();
  for(const [key,words] of Object.entries(EDITION_KW))
    if(words.some(w=>hay.includes(w))) return key;
  return '';
}
function editionBadgeHTML(type){
  if(!type)return '';
  return '<span class="edition-badge '+type+'">'+( EDITION_LABELS[type]||type)+'</span>';
}
function editionTypeLabel(type){return EDITION_LABELS[type]||type;}

function setEditionFilter(val,el){
  smartEditionFilter=val;
  document.querySelectorAll('.edition-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  const q=(document.getElementById('smart-q')||{}).value||'';
  if(q.trim().length>=2) doSearch(q.trim(),0,false);
}

async function smartSearch(immediate){
  const raw=(document.getElementById('smart-q')||{}).value||'';
  const clear=document.getElementById('smart-clear');
  const res=document.getElementById('smart-results');
  if(clear)clear.style.display=raw.trim()?'block':'none';
  if(!raw.trim()){if(res)res.innerHTML='';return;}
  clearTimeout(smartTimer);
  const delay=immediate?0:420;
  smartTimer=setTimeout(async()=>{
    const q = raw.trim();
    if(q.startsWith('http')){
      await handleURLInput(q);
      return;
    }
    // Detect plain ISBN (13 or 10 digits)
    const isISBN = /^(978|979)[0-9]{10}$/.test(q) || /^[0-9]{10}$/.test(q);
    smartLastQ=q;
    smartPage=0;
    if(res)res.innerHTML='<div class="smart-loading"><div class="spin"></div><span>Buscando...</span></div>';
    await doSearch(q,0,false,isISBN);
  },delay);
}

async function handleURLInput(url){
  const res=document.getElementById('smart-results');
  if(res)res.innerHTML='<div class="smart-loading"><div class="spin"></div><span>Analizando URL...</span></div>';
  
  // Extract ISBN from any URL format:
  // isbndb.com/book/9788408304982
  // casadellibro.com/libro-title/9788408304982/123
  // amazon.com/dp/1234567890
  // goodreads.com/book/show/123
  // Any URL containing a 13-digit ISBN starting with 978/979
  const isbnPatterns = [
    /\/book\/([0-9]{10,13})/i,
    /\/dp\/([0-9]{10,13})/i,
    /isbn[=\/\-_]([0-9]{10,13})/i,
    /\/([97][0-9]{12})\b/,
    /\b(97[89][0-9]{10})\b/,
    /\/([0-9]{13})[\/\-_?#]/,
    /\/([0-9]{13})$/
  ];
  
  let isbn = null;
  for(const pat of isbnPatterns){
    const m = url.match(pat);
    if(m){ isbn = m[1]; break; }
  }
  
  if(isbn){
    smartLastQ = isbn;
    await doSearch(isbn, 0, false, true);
    return;
  }
  
  // No ISBN found — extract title keywords from URL slug
  const slug = url.replace(/https?:\/\/[^/]+/,'').split('?')[0]
    .split('/').filter(s=>s.length>2&&!/^\d+$/.test(s)&&!['book','show','libros','libro','product','books','tienda','catalogo','catalog'].includes(s.toLowerCase())).pop()||'';
  const terms = slug.replace(/[-_]/g,' ').replace(/\.html?$/i,'').replace(/\d{13}/g,'').trim();
  
  if(terms.length > 2){
    smartLastQ = terms;
    await doSearch(terms, 0, false, false);
  } else {
    if(res) res.innerHTML='<div class="smart-empty">No se pudo extraer información de esta URL</div>';
  }
}


// fetchISBN — called by old ISBN button (kept for compatibility)
function fetchISBN(){
  const isbnEl = document.getElementById('a-isbn');
  const val = isbnEl ? isbnEl.value.trim() : '';
  if(!val){ showToast('Introduce un ISBN'); return; }
  const sq = document.getElementById('smart-q');
  if(sq){ sq.value = val; sq.dispatchEvent(new Event('input')); }
  smartSearch(true);
}

async function doSearch(query, offset, append, isISBN){
  const res = document.getElementById('smart-results');
  if(!res) return;
  if(!append) res.innerHTML = '<div class="smart-loading"><div class="spin"></div><span>Buscando...</span></div>';

  const results = [];

  // ── Detect if query is ISBN ──────────────────────────────────
  const cleanISBN = (query||'').replace(/[\s\-]/g,'');
  const looksLikeISBN = isISBN || /^(978|979)\d{10}$/.test(cleanISBN) || /^\d{10}$/.test(cleanISBN);

  if(looksLikeISBN){
    const isbn = cleanISBN;

    // Source 1: Google Books
    try{
      const r = await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn+'&maxResults=5');
      if(r.ok){
        const d = await r.json();
        if(d.items) parseGoogleBooks(d.items, results);
      }
    }catch(e){}

    // Source 2: Open Library ISBN direct
    try{
      const r = await fetch('https://openlibrary.org/isbn/'+isbn+'.json');
      if(r.ok){
        const d = await r.json();
        if(d.title) parseOpenLibraryDirect(d, isbn, results);
      }
    }catch(e){}

    // Source 3: Open Library search
    try{
      const r = await fetch('https://openlibrary.org/search.json?isbn='+isbn+'&limit=3&fields=key,title,author_name,cover_i,first_publish_year,publisher,isbn');
      if(r.ok){
        const d = await r.json();
        if(d.docs) parseOpenLibraryDocs(d.docs, results);
      }
    }catch(e){}

    // Source 4: ISBNdb (free tier via proxy)
    try{
      const r = await fetch('https://api2.isbndb.com/book/'+isbn, {
        headers:{'Authorization':'54_8b2f3e1a9d7c6b4e2f0a3d5c8e7b1f4a'}
      });
      if(r.ok){
        const d = await r.json();
        if(d.book) parseISBNdb(d.book, results);
      }
    }catch(e){}

    // If still no results → use Claude API as last resort
    if(results.length === 0){
      res.innerHTML = '<div class="smart-loading"><div class="spin"></div><span>Consultando IA...</span></div>';
      const aiResult = await searchWithClaude('ISBN: '+isbn);
      if(aiResult) results.push(aiResult);
    }

  } else {
    // Text search — title/author
    // Source 1: Google Books
    try{
      const r = await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(query)+'&maxResults=15&startIndex='+(offset||0)+'&printType=books&langRestrict=es');
      if(r.ok){ const d=await r.json(); if(d.items) parseGoogleBooks(d.items, results); }
    }catch(e){}

    // Source 2: Google Books without lang restriction (catches more)
    try{
      const r = await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(query)+'&maxResults=10&startIndex='+(offset||0)+'&printType=books');
      if(r.ok){ const d=await r.json(); if(d.items) parseGoogleBooks(d.items, results); }
    }catch(e){}

    // Source 3: Open Library text search
    try{
      const r = await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(query)+'&limit=8&fields=key,title,author_name,cover_i,first_publish_year,publisher,isbn');
      if(r.ok){ const d=await r.json(); if(d.docs) parseOpenLibraryDocs(d.docs, results); }
    }catch(e){}

    // Claude fallback if < 2 results
    if(results.length < 2){
      res.innerHTML = '<div class="smart-loading"><div class="spin"></div><span>Buscando en más fuentes...</span></div>';
      const aiResult = await searchWithClaude(query);
      if(aiResult) results.push(aiResult);
    }
  }

  renderSearchResults(res, results, query, offset, append);
}

// ── PARSE HELPERS ────────────────────────────────────────────────
function parseGoogleBooks(items, results){
  items.forEach(item=>{
    const info = item.volumeInfo||{};
    const img = ((info.imageLinks||{}).thumbnail||(info.imageLinks||{}).smallThumbnail||'').replace('http://','https://');
    const t = info.title||'';
    const key = t.toLowerCase()+((info.authors||[])[0]||'').toLowerCase();
    if(!results.some(r=>r._key===key)){
      results.push({_key:key,
        title:t, subtitle:info.subtitle||'',
        author:(info.authors||[]).join(', '),
        year:(info.publishedDate||'').slice(0,4),
        publisher:info.publisher||'',
        coverUrl:img, coverId:0,
        subject:(info.categories||[])[0]||'',
        isbn:((info.industryIdentifiers||[]).find(x=>x.type==='ISBN_13')||{}).identifier||'',
        synopsis:info.description||'',
        editionType:detectEditionType(t, info.subtitle||'')
      });
    }
  });
}

function parseOpenLibraryDirect(d, isbn, results){
  const cid = d.covers ? d.covers[0] : 0;
  const key = (d.title||'').toLowerCase();
  if(!results.some(r=>r._key===key)){
    results.push({_key:key,
      title:d.title||'', subtitle:'',
      author:'', year:d.publish_date?(d.publish_date+'').slice(-4):'',
      publisher:(d.publishers||[])[0]||'',
      coverUrl:cid?'https://covers.openlibrary.org/b/id/'+cid+'-M.jpg':'',
      coverId:cid||0, subject:'',
      isbn:(d.isbn_13||d.isbn_10||[isbn])[0]||isbn,
      synopsis:'', editionType:null
    });
  }
}

function parseOpenLibraryDocs(docs, results){
  docs.forEach(doc=>{
    if(!doc.title) return;
    const cid = doc.cover_i||0;
    const key = (doc.title||'').toLowerCase()+((doc.author_name||[])[0]||'').toLowerCase();
    if(!results.some(r=>r._key===key)){
      results.push({_key:key,
        title:doc.title||'', subtitle:'',
        author:(doc.author_name||[]).join(', '),
        year:(doc.first_publish_year||'')+'',
        publisher:(doc.publisher||[])[0]||'',
        coverUrl:cid?'https://covers.openlibrary.org/b/id/'+cid+'-M.jpg':'',
        coverId:cid||0, subject:'',
        isbn:(doc.isbn||[])[0]||'',
        synopsis:'', editionType:null
      });
    }
  });
}

function parseISBNdb(book, results){
  const key = (book.title||'').toLowerCase()+(book.authors||[]).join('').toLowerCase();
  if(!results.some(r=>r._key===key)){
    results.push({_key:key,
      title:book.title||'', subtitle:book.title_long||'',
      author:(book.authors||[]).join(', '),
      year:(book.date_published||'').slice(0,4),
      publisher:book.publisher||'',
      coverUrl:book.image||'',
      coverId:0, subject:book.subjects?book.subjects[0]:'',
      isbn:book.isbn13||book.isbn||'',
      synopsis:book.synopsis||'',
      editionType:null
    });
  }
}

// ── CLAUDE API FALLBACK ─────────────────────────────────────────
async function searchWithClaude(query){
  try{
    const prompt = `Busca información del libro: "${query}"
    
Responde SOLO con un JSON válido (sin markdown, sin explicación) con esta estructura exacta:
{
  "title": "título del libro",
  "subtitle": "",
  "author": "autor",
  "year": "año publicación",
  "publisher": "editorial",
  "isbn": "ISBN-13 si lo conoces",
  "coverUrl": "",
  "subject": "género/categoría",
  "synopsis": "sinopsis breve de 2-3 frases"
}

Si es un ISBN que no reconoces, devuelve null.`;

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:500,
        messages:[{role:'user', content:prompt}]
      })
    });

    if(!resp.ok) return null;
    const data = await resp.json();
    const text = data.content?.[0]?.text||'';
    if(text === 'null' || !text) return null;

    const clean = text.replace(/```json|```/g,'').trim();
    const book = JSON.parse(clean);
    if(!book || !book.title) return null;

    return {
      _key: (book.title||'').toLowerCase()+(book.author||'').toLowerCase(),
      title: book.title||'',
      subtitle: book.subtitle||'',
      author: book.author||'',
      year: book.year||'',
      publisher: book.publisher||'',
      isbn: book.isbn||'',
      coverUrl: book.coverUrl||'',
      coverId: 0,
      subject: book.subject||'',
      synopsis: book.synopsis||'',
      editionType: null,
      _fromAI: true
    };
  }catch(e){
    console.warn('Claude search failed:', e);
    return null;
  }
}

async function exportBackup(){

  try{
    const exportData = {
      version: 3,
      exportDate: new Date().toISOString(),
      books: await Promise.all(books.map(async b=>{
        const c = {...b};
        if(typeof c.cover === 'string' && c.cover.startsWith('/api/cover/')){ try{ c.cover = await urlToDataUrl(c.cover); }catch(e){} }
        return c;
      }))
    };
    if(typeof walletBalance !== 'undefined'){
      exportData.wallet = { balance: walletBalance, txs: walletTxList || [] };
    }
    exportData.funkos = funkos.map(f=>({...f}));
    const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gotham-library-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('✓ Backup exportado · ' + books.length + ' libros · ' + funkos.length + ' Funkos');
  }catch(e){
    showToast('Error al exportar: ' + e.message);
  }
}


async function importBackup(input){
  const file = input && input.files && input.files[0];
  if(!file){ return; }

  if(!confirm('¿Restaurar backup?\n\nEsto reemplazará todos tus ' + books.length + ' libros actuales.\n\nEsta acción no se puede deshacer.')){
    input.value = '';
    return;
  }

  showToast('Importando...');
  try{
    const text = await file.text();
    const payload = JSON.parse(text);

    if(!payload.books || !Array.isArray(payload.books)){
      showToast('Archivo inválido — no es un backup de Gotham Library');
      input.value = '';
      return;
    }

    // Restore books — covers stay embedded in each book object
    books = payload.books;

    // Restore wallet if present
    if(payload.wallet){
      walletBalance = payload.wallet.balance || 0;
      walletTxList = payload.wallet.txs || [];
      try{ localStorage.setItem('gl_wallet', JSON.stringify({balance:walletBalance, txs:walletTxList})); }catch(e){}
    }

    // Restore Funkos if present
    if(Array.isArray(payload.funkos)){ funkos = payload.funkos; await saveFunkos(); renderFunkos(); }

    // Save to localStorage and push to cloud (with covers included)
    await saveBooks();

    renderHome(); renderLibrary(); renderWishlist();
    if(typeof renderProfile === 'function') renderProfile();

    const coverCount = books.filter(b=>b.cover && b.cover.startsWith('data:')).length;
    showToast('✓ ' + books.length + ' libros restaurados · ' + coverCount + ' portadas' + (Array.isArray(payload.funkos) ? ' · ' + funkos.length + ' Funkos' : ''));

  }catch(e){
    console.error('Import error:', e);
    showToast('Error al importar — verifica que el archivo sea correcto');
  }
  input.value = '';
}


// Tracks if user already confirmed duplicate
let _dupConfirmed = false;

function submitAdd(){
  const titleEl=document.getElementById('a-title');
  const _newTitle=titleEl?titleEl.value.trim():'';
  
  // If user already tapped twice (confirmed), just add
  if(_dupConfirmed){ _dupConfirmed=false; _doSubmitAdd(); return; }
  
  // Always check localStorage too in case books array isn't loaded
  let _booksToCheck = books&&books.length>0 ? books : [];
  if(_booksToCheck.length===0){
    try{
      const _ls=localStorage.getItem('gl_books_v4');
      if(_ls) _booksToCheck=JSON.parse(_ls);
    }catch(e){}
  }

  if(_newTitle&&_booksToCheck.length>0){
    const normalize=s=>s.toLowerCase().replace(/[\s\-_.,!?:;'"()\[\]]/g,' ').replace(/\s+/g,' ').trim();
    const normalNew=normalize(_newTitle);
    const _dup=_booksToCheck.find(b=>{
      if(!b||!b.title)return false;
      const n=normalize(b.title);
      return n===normalNew;
    });
    
    if(_dup){
      const _st={terminado:'Terminado ✓',leyendo:'Leyendo 📖',pendiente:'Pendiente ⏳',wishlist:'Wishlist ❤️',abandonado:'Abandonado'};
      showInlineDupWarning(_dup.title, _st[_dup.status]||_dup.status);
      return;
    }
  }
  _doSubmitAdd();
}

function showInlineDupWarning(title, status){
  const old=document.getElementById('dup-warning');
  if(old)old.remove();
  const btn=document.querySelector('#add-screen .save-btn')||document.querySelector('.add-screen .save-btn')||document.querySelector('.save-btn');
  if(!btn){
    // Fallback: append to add-body
    const body=document.querySelector('#add-screen .add-body')||document.querySelector('.add-body');
    if(body)body.appendChild(warning);
    else return;
    warning.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  const warning=document.createElement('div');
  warning.id='dup-warning';
  warning.style.cssText='background:#2a1a00;border:2px solid var(--gold);border-radius:12px;padding:14px;margin-bottom:10px;';
  // Use onclick with global functions — most reliable in iOS webapp mode
  warning.innerHTML=
    '<div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:4px">⚠️ Ya tienes este libro</div>'+
    '<div style="font-size:12px;color:var(--text2);margin-bottom:10px">"'+esc(title)+'" · '+esc(status)+'</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
      '<div onclick="dupCancel()" style="padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:13px;font-family:Inter,sans-serif;cursor:pointer;text-align:center;-webkit-tap-highlight-color:rgba(255,255,255,0.1);user-select:none">Cancelar</div>'+
      '<div onclick="dupConfirm()" style="padding:12px;background:var(--gold);border-radius:8px;color:#000;font-size:13px;font-weight:700;font-family:Inter,sans-serif;cursor:pointer;text-align:center;-webkit-tap-highlight-color:rgba(0,0,0,0.1);user-select:none">Añadir igual →</div>'+
    '</div>';
  btn.parentNode.insertBefore(warning, btn);
  warning.scrollIntoView({behavior:'smooth',block:'center'});
}

  const author=(document.getElementById('a-author').value||'').trim();
  if(!title){showToast('El título es obligatorio');return;}
  const pg=document.getElementById('a-prog');

    year:document.getElementById('a-year').value||'',
    language:document.getElementById('a-lang').value||'ES',
    genre:document.getElementById('a-genre').value||'',
    synopsis:document.getElementById('a-syn').value||'',
    notes:document.getElementById('a-notes').value||'',
    progress:addStatus==='leyendo'?parseInt(pg&&pg.value||0):addStatus==='terminado'?100:0,
    reread:null,points:addStatus==='terminado'?10:0,
    isbn:document.getElementById('a-isbn').value||'',
    editions:[...addEditions]};
  books.unshift(nb);

  const _title=title;
  const _status=addStatus;

  // Cerrar pantalla inmediatamente
  const as=document.getElementById('add-screen');
  as.classList.remove('open');
  as.style.display='none';
  as.innerHTML='';
  addRating=0;

  showToast('✓ Añadido — guardando…');

  // Guardar portada en Firestore si es base64, luego guardar todo
  (async()=>{
    if(coverRaw&&coverRaw.startsWith('data:')){
      // Ya está comprimido (lo comprimió handleAddCover)
      // Solo guardarlo en Firestore y localStorage
      try{localStorage.setItem('cover_'+nb.id, coverRaw);}catch(e){}
      saveCoverToCloud(nb.id, coverRaw);
      coverCache[nb.id]=coverRaw;
      
    }
    await saveBooks();
    renderHome();renderLibrary();renderWishlist();
    showToast('✓ Libro guardado');
    if(_status==='terminado')setTimeout(()=>showRewardModal(_title),500);
  })();
}

}
function badge(b){
  const map={terminado:`<div class="badge badge-done"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Terminado</div>`,leyendo:`<div class="badge badge-reading"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>Leyendo</div>`,pendiente:`<div class="badge badge-pending"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Pendiente</div>`,wishlist:`<div class="badge badge-wish"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>Wishlist</div>`,abandonado:`<div class="badge badge-abandon"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Abandonado</div>`};
  return map[b.status]||'';
}
function stars(n){return `<div class="stars-mini">${[1,2,3,4,5].map(i=>`<svg class="star-mini${i>n?' empty':''}" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`).join('')}</div><span style="font-size:11px;color:var(--text2);margin-left:2px">${n}</span>`;}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// ── MULTI-SELECT ──────────────────────────────────────────────────
let selectMode = false;
let selectedIds = new Set();

function toggleSelectMode(){
  selectMode = !selectMode;
  selectedIds.clear();
  const bookList = document.getElementById('book-list');
  const bulkBar = document.getElementById('bulk-bar');
  const btn = document.getElementById('sel-mode-btn');
  if(bookList) bookList.classList.toggle('select-mode', selectMode);
  if(bulkBar) bulkBar.classList.toggle('show', selectMode);
  if(btn) btn.style.color = selectMode ? 'var(--gold)' : 'var(--text2)';
  updateSelCount();
  if(selectMode){
    showToast('Toca los libros para seleccionarlos');
    setupSelectDelegation();
  }
}

function setupSelectDelegation(){
  const bookList = document.getElementById('book-list');
  if(!bookList || bookList._selDelegated) return;
  bookList._selDelegated = true;
  bookList.addEventListener('click', function(e){
    if(!selectMode) return;
    e.stopPropagation();
    e.preventDefault();
    const item = e.target.closest('.book-item');
    if(!item) return;
    const id = item.dataset.id;
    if(!id) return;
    if(selectedIds.has(id)){
      selectedIds.delete(id);
      item.classList.remove('selected');
      const chk = item.querySelector('.sel-check');
      if(chk) chk.innerHTML = '';
    } else {
      selectedIds.add(id);
      item.classList.add('selected');
      const chk = item.querySelector('.sel-check');
      if(chk) chk.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
    }
    updateSelCount();
  }, true); // capture phase — fires before any child onclick
}

function toggleBookSelect(id, el){
  if(!selectMode) return false;
  if(selectedIds.has(id)){
    selectedIds.delete(id);
    el.classList.remove('selected');
    const chk = el.querySelector('.sel-check');
    if(chk) chk.innerHTML = '';
  } else {
    selectedIds.add(id);
    el.classList.add('selected');
    const chk = el.querySelector('.sel-check');
    if(chk) chk.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
  }
  updateSelCount();
  return true; // consumed the tap
}

function updateSelCount(){
  const el = document.getElementById('sel-count');
  if(el) el.textContent = selectedIds.size + ' seleccionado' + (selectedIds.size !== 1 ? 's' : '');
}

function bulkAction(newStatus){
  if(selectedIds.size === 0){ showToast('Selecciona al menos un libro'); return; }
  const count = selectedIds.size;
  books.forEach(b => {
    if(selectedIds.has(b.id)){
      b.status = newStatus;
      if(newStatus === 'terminado' && b.progress < 100) b.progress = 100;
    }
  });
  saveBooks();
  const labels = {leyendo:'Leyendo',pendiente:'Pendiente',terminado:'Terminado',wishlist:'Wishlist',abandonado:'Abandonado'};
  showToast('✓ ' + count + ' libros → ' + labels[newStatus]);
  toggleSelectMode();
  renderLibrary();
  renderHome();
}

function bulkDelete(){
  if(selectedIds.size === 0){ showToast('Selecciona al menos un libro'); return; }
  const count = selectedIds.size;
  books = books.filter(b => !selectedIds.has(b.id));
  saveBooks();
  showToast('🗑️ ' + count + ' libros eliminados');
  toggleSelectMode();
  renderLibrary();
  renderHome();
}
